# Signed + notarized Apple Silicon (arm64) macOS build. No Intel builds.
#
# Builds what `npm run build:signed:sandboxed` builds locally, on a clean
# GitHub-hosted Mac, and uploads the .dmg/.zip as a workflow artifact. It does
# NOT publish anything: releasing stays local, through scripts/publish-release.sh,
# whose checks (and the mirror to transmission-updates) each trace to a release
# that broke. To ship a CI build:
#
#   rm -f dist/*.dmg dist/*.zip
#   gh run download <run-id> --name transmission-mac --dir dist
#   npm run release:publish -- --manifest-notes release-notes/<version>.txt
#
# Secrets (Settings → Secrets and variables → Actions), same names as the
# ts2068-disk-browser workflow:
#   MAC_CERT_P12_BASE64   Developer ID Application cert + key, base64 of the .p12
#   MAC_CERT_PASSWORD     the .p12's password
#   APPLE_API_KEY_BASE64  App Store Connect API key, base64 of AuthKey_<id>.p8
#   APPLE_API_KEY_ID      the key's ID
#   APPLE_API_ISSUER      the key's issuer UUID
#
# The sandbox workaround in build-signed-mac.sh (build in /tmp, copy back only
# the containers) is specific to building inside a tool-mediated sandbox; a
# hosted runner has no com.apple.provenance problem, so this builds in place.

name: Build signed macOS app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # the prune step deletes older build artifacts

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall rebuilds better-sqlite3 against Electron.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # A tag must match package.json, or the bundle would carry a different
      # version than the tag — publish-release.sh would refuse it anyway, but
      # failing here saves a 20-minute build and two notarization round trips.
      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="$(node -p "require('./package.json').version")"
          LOCK="$(node -p "require('./package-lock.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json is $PKG"; exit 1; }
          [ "$LOCK" = "$PKG" ] || { echo "::error::package-lock.json is $LOCK but package.json is $PKG"; exit 1; }

      - name: Prepare signing keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for v in MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_BASE64; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

          # A dedicated keychain, unlocked for the whole build.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Exactly one Developer ID Application identity, or signing is ambiguous.
          COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Developer ID Application' || true)"
          [ "$COUNT" = "1" ] || { echo "::error::expected 1 Developer ID Application identity, found $COUNT"; exit 1; }

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"

      # Prove Apple accepts the API key BEFORE the build. A rejected key surfaces
      # inside electron-builder as `"Error: HTT"... is not valid JSON` — the
      # notarize library tries to parse notarytool's error text as JSON and the
      # real message (401 bad key / 403 agreement pending) is lost. That's what
      # the first CI run showed. Values are never printed; GitHub also masks them.
      - name: Check notarization credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -uo pipefail
          bad=0
          [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] \
            || { echo "::error::APPLE_API_KEY_ID isn't a 10-character key ID (length ${#APPLE_API_KEY_ID}; check for spaces or a newline)"; bad=1; }
          [[ "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] \
            || { echo "::error::APPLE_API_ISSUER isn't an issuer UUID (length ${#APPLE_API_ISSUER})"; bad=1; }
          head -1 "$APPLE_API_KEY" | grep -q -- '-----BEGIN PRIVATE KEY-----' \
            || { echo "::error::APPLE_API_KEY_BASE64 doesn't decode to a .p8 private key"; bad=1; }
          [ "$bad" = 0 ] || exit 1
          if ! out="$(xcrun notarytool history --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" 2>&1)"; then
            echo "$out"
            echo "::error::Apple rejected the notarization credentials (401 = wrong key/ID/issuer; 403 = accept the latest agreement in App Store Connect)"
            exit 1
          fi
          echo "Apple accepts the notarization credentials."

      # electron-builder signs with the keychain identity and, with the three
      # APPLE_API_* variables set, notarizes and staples the .app.
      - name: Build, sign and notarize the app
        run: npx electron-builder --mac --arm64 --publish never
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Use the identity already in the keychain rather than re-importing a
          # .p12 per codesign call, which hung on the old universal builds.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'

      # electron-builder staples the .app, not the disk image around it, so the
      # .dmg needs network access on first open unless it gets its own ticket.
      # Same step as build-signed-mac.sh.
      - name: Notarize and staple the dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for dmg in dist/*.dmg; do
            echo "Notarizing $(basename "$dmg") ..."
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
          done

      # The same shippability checks publish-release.sh runs, so a bad build
      # fails here instead of after you've downloaded it.
      - name: Verify the artifacts
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DMG="$(ls dist/*-"$VERSION"-*.dmg 2>/dev/null | head -1 || true)"
          [ -n "$DMG" ] || DMG="$(ls dist/*.dmg | head -1)"
          ls dist/*.zip >/dev/null

          xcrun stapler validate "$DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP="$MOUNT/Transmission.app"
          [ -d "$APP" ] || { echo "::error::no Transmission.app inside the dmg"; exit 1; }

          xcrun stapler validate "$APP"
          spctl -a -vvv -t install "$APP" 2>&1 | tee /dev/stderr | grep -q "source=Notarized Developer ID" \
            || { echo "::error::Gatekeeper does not accept the app as Notarized Developer ID"; exit 1; }

          APP_VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")"
          [ "$APP_VERSION" = "$VERSION" ] || { echo "::error::bundle says $APP_VERSION, package.json says $VERSION"; exit 1; }

          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Transmission")"
          case "$ARCHS" in
            arm64) echo "Apple Silicon: $ARCHS" ;;
            *) echo "::error::expected an arm64-only binary, got: $ARCHS"; exit 1 ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: transmission-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      # Each build is ~480 MB and private-repo artifacts count against the
      # account's 0.5 GB of Actions storage, so keep only this build: two
      # (~970 MB) were still over the limit.
      # Older builds aren't needed: releases are published from dist/ by
      # publish-release.sh, not from these artifacts.
      - name: Keep only the newest build
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 1
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=transmission-mac&per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | [.created_at, .id] | @tsv' \
            | sort -r | tail -n +"$((KEEP + 1))" | cut -f2 \
            | while read -r id; do
                echo "Deleting older artifact $id"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              done

      - name: Remove signing keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
