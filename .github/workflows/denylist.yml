# Fails if a real client name or domain is in the tree or in a commit message.
# The terms live hashed in scripts/denylist.json; see scripts/check-denylist.js
# for why, and CLAUDE.md ("Client confidentiality") for the rule. The local
# pre-commit hook runs the same check; this catches commits made without it.

name: Client denylist

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Files and file names
        run: node scripts/check-denylist.js --tree
      - name: Commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch's "before" is all zeros: check what it adds over main.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [ -n "$BASE" ] && [ "$BASE" != "$HEAD_SHA" ]; then
            node scripts/check-denylist.js --range "$BASE..$HEAD_SHA"
          else
            node scripts/check-denylist.js --range "$HEAD_SHA~1..$HEAD_SHA"
          fi
